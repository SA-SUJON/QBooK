name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The signing key is held as a repository secret, never in the tree.
      # A fork without the secret still builds; the APK is just unsigned.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secret available - the release APK will be unsigned."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > dustbook-release.jks
          echo "keystore restored: $(stat -c%s dustbook-release.jks) bytes"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Verify blocklist asset
        run: |
          test -f app/src/main/assets/blocklist.txt.gz || (echo "blocklist missing" && exit 1)
          echo "blocklist entries: $(gunzip -c app/src/main/assets/blocklist.txt.gz | wc -l)"
          test -f app/src/main/assets/fb_cosmetic.txt || (echo "cosmetic rules missing" && exit 1)
          echo "cosmetic rules: $(grep -vc '^!' app/src/main/assets/fb_cosmetic.txt)"

      - name: Feed guard (blank page / unblocked ads regression)
        run: |
          npm install jsdom --silent --no-fund --no-audit --no-save
          node tools/test_feed_guard.js
          node tools/test_cosmetic_engine.js
          node tools/test_mfacebook_ads.js
          node tools/test_native_behaviour.js
          node tools/test_update_flow.js
          node tools/test_offline_ui.js
          node tools/test_offline_pipeline.js
          node tools/test_offline_spec.js

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Verify the blocklist is readable inside the APK
        run: python3 tools/verify_blocklist.py $(ls app/build/outputs/apk/release/*.apk | head -1)

      - name: Verify signing certificate is stable
        if: env.SIGNED == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          DIGEST=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "certificate SHA-256: $DIGEST"
          EXPECTED="e70f0b96c4259e4dd36d27060a04ee27440bd96fe71c47d3c5a956b5f5413245"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed. Updates would not install."
            echo "expected $EXPECTED"
            exit 1
          fi
          echo "Certificate matches - updates will install over the previous build."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dustbook-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dustbook-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
